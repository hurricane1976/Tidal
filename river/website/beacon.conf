limit_req_zone $binary_remote_addr zone=agoralimit:10m rate=6r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /home/agent/Tidal/river/website;
    index index.html;

    server_name _;

    # Security Hardening Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /api/agora {
        limit_req zone=agoralimit burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        default_type application/json;
        try_files $uri $uri/ /api/index.html;
    }
}
